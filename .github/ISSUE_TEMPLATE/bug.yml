name: Bug
description: Report a defect in a supported Mizen composition
title: "[Bug] "
labels:
  - type:bug
  - component:needs-triage
  - severity:needs-triage
  - status:triage
body:
  - type: markdown
    attributes:
      value:
        Search existing issues before submitting. Link an existing report instead of creating a
        duplicate. Maintainers confirm component, severity, and status labels during triage.
  - type: input
    id: version
    attributes:
      label: Installed Mizen version
      description: Record the installed @mizen-labs/ui version from the app lockfile.
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Affected component or composition
      description: Use component names or slugs. For a new interaction, describe its purpose.
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Operator task
      description: Describe the real app workflow and link its reproduction or report. Remove private user data.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      description: Include browser version, OS, and assistive technology if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Smallest supported reproduction
      description:
        Link the documented API you checked. Include minimal code or a reproduction URL and
        exact steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what the documented composition should do.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe what happens, including frequency.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Operator impact
      description: Explain blocked work, data loss risk, and any supported workaround.
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: App or library ownership
      description: Explain why the smallest supported composition points to Mizen. State uncertainty explicitly.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Attach logs, a recording, or screenshots. State if none are available.
    validations:
      required: false
  - type: textarea
    id: existing
    attributes:
      label: Existing issue search
      description: List search terms and relevant issue links. Write “No matching issue found” when appropriate.
    validations:
      required: true
