name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Packages / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        node: [ "22.18.0", "24.11.0" ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          require-lockfile: true
      - name: Build package dependencies
        run: pnpm --filter @mizen-labs/ui build
      - name: CLI contracts and installed framework diagnostics
        run: pnpm --filter @mizen-labs/cli test
        env:
          MIZEN_PACKED_CONSUMER: "1"
      - name: Verify release archives with npm and pnpm
        shell: bash
        run: pnpm release:check 2>&1 | tee release-check.log
      - name: Retain release diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-log-${{ matrix.os }}-node-${{ matrix.node }}
          path: release-check.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain verified candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}-node-${{ matrix.node }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 90

  consumers:
    name: Production consumer / ${{ matrix.consumer }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        consumer:
          [
            "Next with npm",
            "Start with pnpm",
            "Vite React JSX",
            "Vite React TSX",
          ]
        test: [ tests/cli-init.integration.test.ts ]
        # The same archive without the CLI: packed type declarations of every
        # public export, and size budgets.
        include:
          - consumer: standalone Next consumer
            test: tests/package-consumer.integration.test.ts
          - consumer: standalone TanStack Start consumer
            test: tests/package-consumer.integration.test.ts
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      MIZEN_DOCS_TEST_URL: http://localhost:3000
      MIZEN_PACKED_CONSUMER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24.15.0
          cache: true
          require-lockfile: true
      - parallel:
          - name: Build packages
            run: pnpm --filter @mizen-labs/ui build && pnpm --filter @mizen-labs/cli build
          - name: Install Chromium
            run: pnpm --filter @mizen-labs/docs exec playwright install --with-deps chromium
      - name: Packed archives, production builds, and browser behavior
        shell: bash
        env:
          CONSUMER: ${{ matrix.consumer }}
          TEST: ${{ matrix.test }}
        run: pnpm --filter @mizen-labs/docs test "$TEST" --testNamePattern="$CONSUMER"

  quality:
    name: Quality and docs build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      MIZEN_DOCS_TEST_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24.15.0
          cache: true
          require-lockfile: true
      - name: Build production docs and packages
        run: pnpm build
      - parallel:
          - name: Lint and format
            run: pnpm lint:check
          - name: Typecheck
            run: pnpm -r typecheck
      - name: Theme, source, and distribution contracts
        run: >-
          pnpm --filter @mizen-labs/docs test
          tests/theme-behavior.test.ts tests/theme-contract.test.ts
          tests/theme-storage.test.ts tests/theme-transition-guard.test.ts
          tests/package-distribution.test.ts tests/docs-source-contract.test.ts

  benchmarks:
    name: Benchmarks / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24.11.0
          cache: true
          require-lockfile: true
      - name: Benchmark installed CLI and package size
        shell: bash
        run: pnpm benchmark:cli 2>&1 | tee benchmark.log
      - name: Retain CLI benchmark reports and replay inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-benchmark-${{ matrix.os }}-node-24.11.0
          path: |
            artifacts/benchmarks/
            benchmark.log
          if-no-files-found: warn
          retention-days: 14
  ci:
    name: CI result
    if: always()
    needs: [ packages, consumers, quality, benchmarks ]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
