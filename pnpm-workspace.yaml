packages:
  - apps/*
  - packages/*
minimumReleaseAgeExclude:
  - sugar-high@2.6.4
  - "@tanstack/charts@1.5.0"
  - "@tanstack/react-router-devtools@1.167.3"
  - "@tanstack/router-devtools-core@1.168.3"
permissions:
  esbuild@0.28.2:
    build: true
  workerd@1.20261101.1 || 1.20261104.1:
    build: true
  "@tanstack/charts":
    skills: true
  "@tanstack/react-table":
    skills: true
  ultracite:
    skills: true
skills:
  dirs:
    - .agents/skills

# Keep Start plugins and the docs test runner on Vite+'s matching toolchain.
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.5.0
  vitest@*: 5.1.0
peerDependencyRules:
  allowedVersions:
    vite: "*"
